[project]
name = "approved"
version = "0.1.0"
description = "Hosted approval.md with an advisory AI judge in the loop."
license = "MIT"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2",
    "httpx>=0.27",
    "weave>=0.51",
    "openai>=1.40",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
approved = "approved.__main__:main_entry"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-socket>=0.7",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/approved"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No test may open a network socket: every HTTP peer is an httpx.MockTransport.
addopts = "--disable-socket --allow-unix-socket -ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "BLE", "PT"]
ignore = [
    "S101", # assert is how pytest asserts
]

[tool.ruff.lint.per-file-ignores]
# HTML markup: long lines read better unbroken than split mid-tag.
"src/approved/console/pages.py" = ["E501"]
"tests/**" = ["S105", "S106", "S108"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
