<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-labelledby="nope-title">
  <title id="nope-title">Nope: a hooded figure turns away and raises a palm</title>
  <defs>
    <clipPath id="nope-paper"><rect x="8" y="8" width="292" height="292" rx="38"/></clipPath>
  </defs>
  <!-- sticker: hard offset shadow, linen paper -->
  <rect x="20" y="20" width="292" height="292" rx="38" fill="#17191d"/>
  <rect x="8" y="8" width="292" height="292" rx="38" fill="#f6f3ec"/>
  <g clip-path="url(#nope-paper)" stroke="#17191d" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- shoulders -->
    <path d="M 96 316 C 100 254 132 230 178 230 C 224 230 252 254 258 316 Z" fill="#c8a48a"/>
    <!-- hood, the face turned away to the right -->
    <path d="M 124 238 C 104 200 108 116 162 92 C 210 74 256 110 254 166 C 252 204 238 228 218 240 Z" fill="#c8a48a"/>
    <path d="M 150 118 C 170 100 206 98 228 116" fill="none" opacity=".35"/>
    <ellipse cx="214" cy="166" rx="36" ry="49" fill="#a3826a"/>
    <ellipse cx="220" cy="168" rx="25" ry="39" fill="#fde8d0"/>
    <!-- a small flat mouth, off to the side -->
    <path d="M 228 194 Q 234 191 240 194" fill="none"/>
    <!-- the raised arm and palm, pushed out to the left -->
    <path d="M 112 316 L 74 214 L 110 202 L 150 316 Z" fill="#c8a48a"/>
    <g fill="#fde8d0" transform="rotate(-8 90 170)">
      <rect x="62" y="104" width="14" height="60" rx="7"/>
      <rect x="76" y="94" width="14" height="70" rx="7"/>
      <rect x="90" y="96" width="14" height="68" rx="7"/>
      <rect x="104" y="106" width="14" height="58" rx="7"/>
      <rect x="112" y="150" width="36" height="15" rx="7.5" transform="rotate(-38 116 158)"/>
      <rect x="60" y="144" width="60" height="58" rx="18"/>
    </g>
  </g>
  <rect x="8" y="8" width="292" height="292" rx="38" fill="none" stroke="#17191d" stroke-width="5"/>
</svg>
