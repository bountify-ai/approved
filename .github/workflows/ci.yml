name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Gateway route, credential, and response boundaries
        run: node --test gateway/test/*.test.cjs

  service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Sync
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . ../demo/agent
      - name: Format
        run: uv run ruff format --check . ../demo/agent
      - name: Typecheck
        run: uv run pyright
      - name: Test
        run: uv run pytest
      - name: Offline evaluation (no network, Weave disabled)
        env:
          WEAVE_DISABLED: "true"
        run: uv run python -m approved evaluate --offline
      - name: Connect bundle (README command; local only)
        run: uv run approved connect ci-tenant --facade-url https://facade.example.test --out "$RUNNER_TEMP/connect"

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Relative links and test references in the Markdown
        run: python3 scripts/check_docs.py

  demo-smoke:
    # The whole flow in Docker, offline: gate, judge, fake Telegram, scripted agent.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the daemon image (layer-cached)
        uses: docker/build-push-action@v6
        with:
          context: images/daemon
          load: true
          tags: approved-demo-daemon:local
          cache-from: type=gha,scope=daemon
          cache-to: type=gha,mode=max,scope=daemon
      - name: Build the judge image (layer-cached)
        uses: docker/build-push-action@v6
        with:
          context: service
          load: true
          tags: approved-demo-service:local
          cache-from: type=gha,scope=service
          cache-to: type=gha,mode=max,scope=service
      - name: Demo smoke
        env:
          SKIP_BUILD: "1"
        run: bash demo/smoke.sh

  tryit-smoke:
    # Two private sessions through the real daemon and a loopback inference fixture.
    # No provider credential or paid network call is used by this image smoke.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the try-it image (layer-cached; the runtime stage matches the daemon image's)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/tryit/Dockerfile
          load: true
          tags: approved-tryit:local
          cache-from: |
            type=gha,scope=tryit
            type=gha,scope=daemon
          cache-to: type=gha,mode=max,scope=tryit
      - name: Try-it smoke
        env:
          SKIP_BUILD: "1"
        run: bash images/tryit/smoke.sh
